name: build my angular app

on:
 push:
  branches: [ main ]

jobs:
  build-angular-app:
   runs-on: ubuntu-latest

   steps:
      - uses: actions/checkout@v7
      - name: setup node js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x 
      - name: install dependecies
        run: npm install
      - name: build-angular-app
        run: npm run build        
      
